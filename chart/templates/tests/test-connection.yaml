apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "generic-ml-api.fullname" . }}-test-connection"
  labels:
    {{- include "generic-ml-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "generic-ml-api.fullname" . }}:{{ .Values.apiPort | default 8000 }}']
  restartPolicy: Never
