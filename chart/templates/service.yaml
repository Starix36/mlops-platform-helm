apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic-ml-api.fullname" . }}
  labels:
    {{- include "generic-ml-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.apiPort | default 8000 }}
      targetPort: {{ .Values.apiPort | default 8000 }}
      protocol: TCP
      name: http
  selector:
    {{- include "generic-ml-api.selectorLabels" . | nindent 4 }}
